name: Primeiro CI
on: 
    pull_request:
    push:
        branches: [main]
jobs:
    testes:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: "3.12"
            - name: Instalar dependências
              run: pip install -r requirements-dev.txt
            - name: Rodar testes
              run: pytest -v
