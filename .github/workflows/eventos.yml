name: Eventos e entradas
on: 
    workflow_dispatch:
        inputs:
            nome:
                description: "Quem cumprimetar?"
                required: true
                default: "turma"
    push:
        paths:
            - "src/**"
jobs:
    cumprimentar:
        runs-on: ubuntu-latest
        steps:
            - env:
                NOME: ${{inputs.nome || 'agendamento'}}
              run: echo "Olá, $NOME ($GITHUB_EVENT_NAME)"
